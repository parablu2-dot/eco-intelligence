<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eco Intelligence</title>
<link rel="stylesheet" href="/public/style.css" />
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Eco Intelligence</h1>
    <p class="status" id="statusLine" aria-live="polite"></p>
  </header>

  <nav class="tabs" role="tablist" aria-label="화면">
    <button role="tab" data-tab="today">오늘</button>
    <button role="tab" data-tab="indicators">지표</button>
    <button role="tab" data-tab="notes">노트</button>
    <button role="tab" data-tab="weekly">주간</button>
  </nav>

  <main id="view"></main>
</div>

<dialog class="indicator-modal" id="indicatorModal" aria-labelledby="imTitle">
  <div class="im-head">
    <h2 id="imTitle"></h2>
    <button type="button" class="im-close" id="imClose" aria-label="닫기">×</button>
  </div>
  <div class="im-value" id="imValue"></div>
  <div class="im-meta" id="imMeta"></div>
  <div class="im-desc" id="imDesc"></div>
  <div class="im-ranges" id="imRanges" role="group" aria-label="기간"></div>
  <div class="im-chart" id="imChart"></div>
  <p class="im-note" id="imNote"></p>
  <details class="im-table-wrap">
    <summary>표로 보기</summary>
    <div id="imTable"></div>
  </details>
</dialog>

<script src="/public/app.js"></script>
</body>
</html>
