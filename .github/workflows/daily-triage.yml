name: daily-triage

# 2026-10-05: cheon_view 동결(신규 기록 중단)로 cron 해제 — score-notes/draft-judgment는 cheon_view에 쓰므로
# 천이 동결 해제를 결정하기 전까지 실행하지 않는다. 지표 경보는 공개 Step Summary 대신 요약 메일 본문으로 이동.
on:
  workflow_dispatch: {}

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: npm run triage:score # 룰 기반, LLM 호출 없음

      # status: triaged -> drafted 자동화 (자관_ECO애널리스트_스펙_addendum_cron자동화_2026-08-08).
      # 노트 단위 fail-soft — 개별 실패는 해당 노트를 triaged에 남겨 다음날 재시도, 워크플로 전체를 막지 않음.
      - run: npm run analysis:draft-judgment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - run: npm run build:index


      - name: Commit results
        run: |
          bash scripts/commit-push.sh "chore: daily triage $(TZ=Asia/Seoul date +%F)" data/

      # 스크립트는 fail-soft지만 LLM 전량 실패(크레딧 소진·인증 등)는 여기서 빨간불로 드러냄.
      # 커밋 이후에 두어 수집 데이터는 그대로 저장됨.
      - name: Fail on LLM errors
        if: always()
        run: |
          if [ -s .llm-errors.log ]; then
            while read -r line; do echo "::error::$line"; done < .llm-errors.log
            exit 1
          fi
