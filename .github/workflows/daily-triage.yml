name: daily-triage

on:
  schedule:
    - cron: "48 22 * * *" # 매일 07:48 KST — daily-summary(07:40) 이후
  workflow_dispatch: {}

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: npm run triage:score # 룰 기반, LLM 호출 없음

      # status: triaged -> drafted 자동화 (자관_ECO애널리스트_스펙_addendum_cron자동화_2026-08-08).
      # 노트 단위 fail-soft — 개별 실패는 해당 노트를 triaged에 남겨 다음날 재시도, 워크플로 전체를 막지 않음.
      - run: npm run analysis:draft-judgment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - run: npm run build:index

      # data/indicators/latest.json(daily-indicators 07:25에서 이미 커밋됨)에서 alert_flag=true
      # 항목만 골라 워크플로 실행 결과(Summary 탭) 상단에 "이번 주 알림" 섹션으로 노출.
      # 임계값은 config/indicator-thresholds.json 가안 — 토요일 세션 확정 전까지 참고용.
      - name: 이번 주 알림
        run: npm run indicators:alerts >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          git config user.name "eco-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: daily triage $(date -u +%F)"
          git push
