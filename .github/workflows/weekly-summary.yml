name: weekly-summary

on:
  schedule:
    # 매주 토요일 06:30 KST (금 21:30 UTC) — 지난 7일(일~토) 종합 (T4)
    - cron: "30 21 * * 5"
    # 재시도 — 첫 실행이 cron 누락·API 장애로 결과를 못 남겼을 때만 실제로 돈다(결과 파일 있으면 skip)
    - cron: "30 1 * * 6"
  workflow_dispatch:
    inputs:
      force:
        description: "이번 주 결과가 이미 있어도 다시 생성·발송"
        required: false
        type: boolean

# 본 실행과 재시도가 겹치면 뒤 실행이 기다렸다가 결과 파일을 보고 skip
concurrency:
  group: weekly-summary
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: npm run summary:weekly -- ${{ inputs.force && '--force' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUMMARY_MAIL_TO: ${{ secrets.SUMMARY_MAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ECO_THRESHOLDS_JSON: ${{ secrets.ECO_THRESHOLDS_JSON }}

      - run: npm run build:summary-index

      - name: Commit results
        run: |
          bash scripts/commit-push.sh "chore: weekly summary $(TZ=Asia/Seoul date +%F)" data/summary/
