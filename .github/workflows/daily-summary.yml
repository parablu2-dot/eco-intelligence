name: daily-summary

on:
  schedule:
    - cron: "40 22 * * *" # 매일 07:40 KST — 7축 crawl/distill + indicators 이후
  workflow_dispatch:
    inputs:
      dates:
        description: "요약을 재생성할 날짜(YYYYMMDD, 공백 구분). 비우면 오늘(KST). 백필은 메일 미발송"
        required: false
        type: string

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Summarize
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUMMARY_MAIL_TO: ${{ vars.SUMMARY_MAIL_TO }}
          ECO_THRESHOLDS_JSON: ${{ secrets.ECO_THRESHOLDS_JSON }}
          DATES: ${{ inputs.dates }}
        run: |
          if [ -z "$DATES" ]; then
            npm run summary:daily
          else
            for d in $DATES; do
              npm run --silent summary:daily -- --date="$d"
            done
          fi

      - run: npm run build:summary-index

      - name: Commit results
        run: |
          bash scripts/commit-push.sh "chore: daily summary $(TZ=Asia/Seoul date +%F)" data/summary/
