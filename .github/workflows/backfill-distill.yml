name: backfill-distill

# 크레딧 소진·장애 등으로 distill을 놓친 날의 raw를 재처리하는 수동 워크플로.
# 각 distill 스크립트는 --date가 주어지면 이미 노트가 있는 axis/날짜는 건너뛰므로(덮어쓰기 없음)
# 날짜를 넉넉히 넣어도 안전하다. 이후 날짜별 트리아지 → draft-judgment까지 일반 cron과 같은 순서로 진행.

on:
  workflow_dispatch:
    inputs:
      dates:
        description: "재처리할 날짜(YYYYMMDD, 공백 구분) 예: 20260922 20260923"
        required: true
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATES: ${{ inputs.dates }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Distill missed dates
        run: |
          for d in $DATES; do
            echo "::group::distill $d"
            for axis in geopolitics polarization fed productivity_ai us_investment rates_fx commodities_energy market_signals; do
              npm run --silent "distill:$axis" -- --date="$d"
            done
            echo "::endgroup::"
          done

      - name: Triage missed dates
        run: |
          for d in $DATES; do
            npm run --silent triage:score -- --date="$d"
          done

      - run: npm run analysis:draft-judgment

      - run: npm run build:index

      - name: Commit results
        run: |
          git config user.name "eco-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: backfill distill $DATES"
          git pull --rebase
          git push

      - name: Fail on LLM errors
        if: always()
        run: |
          if [ -s .llm-errors.log ]; then
            while read -r line; do echo "::error::$line"; done < .llm-errors.log
            exit 1
          fi
