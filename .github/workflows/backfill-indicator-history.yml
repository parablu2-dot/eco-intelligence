name: backfill-indicator-history

# 채권·환율 지표 1년치 시드(data/indicators/history-seed.json) 생성 — 수동 실행(T3 전제).
# 일별 스냅샷은 건드리지 않는다. 시드 재생성 후 history.json도 다시 만든다.
on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: node scripts/backfill-indicator-history.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}

      - run: node scripts/build-indicator-history.mjs

      - name: Commit results
        run: |
          bash scripts/commit-push.sh "chore: indicator history seed $(TZ=Asia/Seoul date +%F)" data/indicators/
