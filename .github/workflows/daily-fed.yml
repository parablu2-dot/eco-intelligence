name: daily-fed

on:
  schedule:
    - cron: "30 21 * * *" # 매일 06:30 KST
  workflow_dispatch: {}

jobs:
  crawl-distill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: npm run crawl:fed

      - run: npm run distill:fed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - run: npm run build:index

      - name: Commit results
        run: |
          git config user.name "eco-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: daily fed_policy crawl+distill $(date -u +%F)"
          git push

      # 스크립트는 fail-soft지만 LLM 전량 실패(크레딧 소진·인증 등)는 여기서 빨간불로 드러냄.
      # 커밋 이후에 두어 수집 데이터는 그대로 저장됨.
      - name: Fail on LLM errors
        if: always()
        run: |
          if [ -s .llm-errors.log ]; then
            while read -r line; do echo "::error::$line"; done < .llm-errors.log
            exit 1
          fi
