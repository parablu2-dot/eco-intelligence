name: daily-geopolitics

on:
  schedule:
    - cron: "0 21 * * *" # 매일 06:00 KST
  workflow_dispatch: {}

jobs:
  crawl-distill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: npm run crawl:geopolitics

      - run: npm run distill:geopolitics
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - run: npm run build:index

      - name: Commit results
        run: |
          git config user.name "eco-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: daily geopolitics crawl+distill $(date -u +%F)"
          git push
